[package]
name = "nix-wasm"
description = "Nix evaluator compiled to WASM"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Not published on crates.io. Default features pull in I/O (`impure`) and test
# scaffolding, neither of which belong in a wasm build.
snix-eval = { git = "https://git.snix.dev/snix/snix.git", rev = "ad2f9594d2266c4fbe8b4b55747f54fe73ce883b", default-features = false }
# Must match the `wasm-bindgen-cli` version in the flake exactly.
wasm-bindgen = "=0.2.127"

[lints]
workspace = true
