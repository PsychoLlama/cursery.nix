[package]
name = "cursery"
description = "Nix evaluator compiled to WASM"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.12.1"
console_error_panic_hook = "0.1.7"
include_dir = "0.7.4"
# Must stay in lockstep with `wasm-bindgen`.
js-sys = "=0.3.104"
rustc-hash = "2.1.3"
sha2 = "0.10.9"
smol_str = "0.2.2"
# Not published on crates.io. Default features pull in I/O (`impure`) and test
# scaffolding, neither of which belong in a wasm build.
# Fork carrying wasm fixes (in-memory `EvalIO` imports, rooted paths).
# `rustc-hash` and `smol_str` match its versions: they appear in its API.
snix-eval = { git = "https://github.com/PsychoLlama/snix.git", rev = "8d5b4389d2ba12532e76205832134db45b470dd7", default-features = false }
thiserror = "2.0.21"
# Must match the `wasm-bindgen-cli` version in the flake exactly.
wasm-bindgen = "=0.2.127"
# Must stay in lockstep with `wasm-bindgen`.
web-sys = { version = "=0.3.104", features = ["Attr", "CssRuleList", "CssStyleSheet", "Document", "Element", "Event", "EventTarget", "Node", "Text", "console"] }

[lints]
workspace = true
