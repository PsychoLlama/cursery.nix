[package]
name = "nix-wasm"
description = "Nix evaluator compiled to WASM"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.12.1"
console_error_panic_hook = "0.1.7"
include_dir = "0.7.4"
# Must stay in lockstep with `wasm-bindgen`.
js-sys = "=0.3.104"
sha2 = "0.10.9"
# Not published on crates.io. Default features pull in I/O (`impure`) and test
# scaffolding, neither of which belong in a wasm build.
# Fork carrying wasm fixes (in-memory `EvalIO` imports, rooted paths).
snix-eval = { git = "https://github.com/PsychoLlama/snix.git", rev = "1e81041e2d1aa3ac5fc64fd823cd91e551c3a81a", default-features = false }
thiserror = "2.0.21"
# Must match the `wasm-bindgen-cli` version in the flake exactly.
wasm-bindgen = "=0.2.127"

[lints]
workspace = true
